<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>게시판 - rank-project</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: #0f172a; color: #e2e8f0; font-family: system-ui, sans-serif; padding: 40px 16px; }
        .wrap { max-width: 720px; margin: 0 auto; }
        h1 { font-size: 22px; margin-bottom: 4px; }
        .sub { color: #94a3b8; font-size: 13px; margin-bottom: 24px; }
        .nav { margin-bottom: 20px; }
        .nav a { color: #60a5fa; text-decoration: none; font-size: 14px; }
        .card { display: block; background: #1e293b; border: 1px solid #334155; border-radius: 10px;
                padding: 16px 18px; margin-bottom: 12px; text-decoration: none; color: inherit; transition: .15s; }
        .card:hover { border-color: #3b82f6; transform: translateY(-1px); }
        .card .title { font-weight: 600; font-size: 16px; }
        .card .meta { color: #94a3b8; font-size: 13px; margin-top: 6px; }
        .views { color: #38bdf8; font-weight: 600; }
        .lv { display: inline-block; padding: 1px 8px; border-radius: 999px; font-size: 12px; font-weight: 600;
              background: #334155; color: #e2e8f0; }
        .lv0 { background: #7f1d1d; color: #fecaca; }
        .lv1, .lv2 { background: #78350f; color: #fde68a; }
        .lv3, .lv4 { background: #1e3a8a; color: #bfdbfe; }
        .lv5 { background: #14532d; color: #bbf7d0; }
        .msg { color: #f87171; font-size: 14px; }
    </style>
</head>
<body>
    <div class="wrap">
        <h1>게시판</h1>
        <div class="sub">글을 클릭하면 조회수가 오릅니다. 조회수 어뷰징 방어 실습용 데모입니다.</div>
        <div class="nav"><a href="/dashboard.html">📊 대시보드 / 관리 →</a></div>
        <div id="list"><div class="msg">불러오는 중…</div></div>
    </div>
    <script src="/js/main.js"></script>
</body>
</html>
