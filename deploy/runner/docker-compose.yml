# NAS에서 한 번만 실행: GitHub Actions self-hosted 러너
#   1) 이 파일을 NAS의 /volume1/docker/gh-runner/ 에 복사
#   2) 같은 폴더에 .env 작성:  GH_TOKEN=<GitHub PAT>
#   3) docker compose up -d   (시놀로지 Container Manager > 프로젝트 로 만들어도 됨)
services:
  runner:
    image: myoung34/github-runner:latest
    container_name: gh-runner
    restart: unless-stopped
    environment:
      REPO_URL: https://github.com/ice-wemericano/rank-project_v1
      ACCESS_TOKEN: ${GH_TOKEN}
      RUNNER_SCOPE: repo
      RUNNER_NAME: nas
      LABELS: nas
      RUNNER_WORKDIR: /tmp/runner/work
      CONFIGURED_ACTIONS_RUNNER_FILES_DIR: /runner/data
      DISABLE_AUTO_UPDATE: "true"
    volumes:
      # 러너가 NAS의 Docker로 앱 컨테이너를 빌드/실행
      - /var/run/docker.sock:/var/run/docker.sock
      # 러너 등록정보 유지 (재시작 시 재등록 방지)
      - ./data:/runner/data
      # 앱 .env 를 같은 경로로 노출 (워크플로의 --env-file 이 읽음)
      - /volume1/docker/rank-project:/volume1/docker/rank-project:ro
